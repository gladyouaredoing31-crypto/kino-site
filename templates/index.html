<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ТРЕНИРОВКА — Дневник</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#0a0e14;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;color:#e6edf3}

.app{position:relative;width:100vw;height:100vh;max-width:480px;margin:0 auto;background:#0a0e14;display:flex;flex-direction:column;overflow:hidden}

/* ШАПКА */
.header{background:linear-gradient(180deg,#1a1f2e,#0d1117);border-bottom:1px solid #21262d;padding:12px 14px;flex-shrink:0;position:relative;z-index:10}
.logo{font-size:20px;font-weight:900;background:linear-gradient(135deg,#3fb950,#f0b429,#3fb950);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shine 3s infinite;letter-spacing:2px;text-align:center;margin-bottom:10px}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:200% 50%}}

.stats-row{display:flex;gap:6px}
.stat-mini{flex:1;background:#161b22;border:2px solid #30363d;border-radius:10px;padding:8px 6px;text-align:center}
.stat-mini .num{font-size:16px;font-weight:900;color:#3fb950;font-variant-numeric:tabular-nums}
.stat-mini .lbl{font-size:9px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:2px}

/* КОНТЕНТ */
.content{flex:1;overflow-y:auto;padding:12px;scrollbar-width:thin;padding-bottom:80px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}

/* КАРТОЧКИ */
.card{background:linear-gradient(135deg,#161b22,#1c2333);border:2px solid #30363d;border-radius:14px;padding:14px;margin-bottom:10px;transition:.2s}
.card.exercise{border-left:4px solid #3fb950}
.card.template{border-left:4px solid #f0b429;cursor:pointer}
.card.template:active{transform:scale(.98)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card-title .emoji{font-size:20px}
.card-del{background:rgba(248,81,73,.2);border:1px solid #f85149;color:#f85149;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.card-del:active{transform:scale(.9)}

/* УПРАЖНЕНИЕ - НАСТРОЙКИ */
.ex-sets{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.set-row{display:flex;gap:6px;align-items:center;background:#0a0e14;border:1px solid #30363d;border-radius:8px;padding:6px 8px}
.set-num{width:24px;height:24px;border-radius:50%;background:#3fb950;color:#000;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.set-input{flex:1;background:transparent;border:none;color:#fff;font-size:14px;font-weight:700;padding:4px;text-align:center;font-family:inherit;width:100%}
.set-input:focus{outline:none;color:#3fb950}
.set-input::placeholder{color:#6a737d;font-weight:400;font-size:12px}
.set-label{font-size:10px;color:#8b949e;text-align:center;flex-shrink:0}
.set-remove{background:rgba(248,81,73,.2);border:none;color:#f85149;width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:12px;flex-shrink:0}

.add-set{background:#0a0e14;border:2px dashed #30363d;color:#8b949e;padding:8px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;text-align:center;transition:.2s}
.add-set:active{background:#1c2333;border-color:#3fb950;color:#3fb950}

/* ФОРМА ДОБАВЛЕНИЯ */
.add-btn{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#3fb950,#1a7f37);border:none;color:#fff;font-size:32px;font-weight:300;cursor:pointer;box-shadow:0 6px 24px rgba(63,185,80,.5);z-index:50;display:flex;align-items:center;justify-content:center}
.add-btn:active{transform:scale(.9)}

/* МОДАЛКА */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;align-items:flex-end;backdrop-filter:blur(6px);animation:fadeIn .2s}
.modal.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{width:100%;max-width:480px;margin:0 auto;background:#0d1117;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow-y:auto;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(60px)}to{transform:translateY(0)}}
.modal-title{font-size:18px;font-weight:900;margin-bottom:16px;text-align:center;color:#3fb950}

.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block;font-weight:700}
.form-input{width:100%;background:#161b22;border:2px solid #30363d;border-radius:10px;padding:12px 14px;color:#fff;font-size:15px;font-family:inherit;transition:.2s}
.form-input:focus{outline:none;border-color:#3fb950;background:#1c2333}
.form-input::placeholder{color:#6a737d}

.quick-picks{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick-pick{background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:6px 12px;border-radius:16px;font-size:12px;cursor:pointer;transition:.2s}
.quick-pick:active{transform:scale(.95);background:#1c2333;border-color:#3fb950}

.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}

.btn{width:100%;background:linear-gradient(180deg,#3fb950,#1a7f37);border:none;color:#fff;padding:14px;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:1px;margin-top:8px;transition:.1s}
.btn:active{transform:scale(.97)}
.btn.cancel{background:#21262d;color:#8b949e;margin-top:6px}
.btn.red{background:linear-gradient(180deg,#f85149,#b62324)}

/* ПУСТО */
.empty{text-align:center;padding:60px 20px;color:#6a737d}
.empty .big{font-size:60px;margin-bottom:14px;opacity:.5}
.empty h3{font-size:16px;margin-bottom:6px;color:#c9d1d9}
.empty p{font-size:12px;line-height:1.5}

/* ТАЙМЕР ОТДЫХА */
.rest-timer{position:fixed;top:0;left:0;right:0;background:linear-gradient(90deg,#f0b429,#ff6b6b);color:#000;padding:8px;font-weight:900;font-size:14px;display:none;align-items:center;justify-content:center;gap:10px;z-index:80}
.rest-timer.show{display:flex}
.rest-timer .time{font-size:20px;font-variant-numeric:tabular-nums}

/* TABS */
.tabs{display:flex;gap:4px;background:#161b22;border-radius:10px;padding:4px;margin-bottom:12px}
.tab{flex:1;background:transparent;border:none;color:#8b949e;padding:8px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;transition:.2s;text-transform:uppercase;letter-spacing:.5px}
.tab.active{background:#3fb950;color:#000}
.tab:active{transform:scale(.97)}

/* TOAST */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:#161b22;border:2px solid #3fb950;color:#3fb950;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;transition:.3s;z-index:200;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ПРОГРЕСС */
.progress-card{background:linear-gradient(135deg,#161b22,#1c2333);border:2px solid #30363d;border-radius:14px;padding:14px;margin-bottom:10px}
.progress-title{font-size:13px;font-weight:900;color:#f0b429;margin-bottom:10px}
.progress-bar{height:8px;background:#0a0e14;border-radius:4px;overflow:hidden;margin-bottom:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,#3fb950,#f0b429);border-radius:4px;transition:width .5s}
.progress-info{display:flex;justify-content:space-between;font-size:11px;color:#8b949e}
.progress-info b{color:#3fb950}

/* ДОСТИЖЕНИЕ */
.achievement{background:linear-gradient(135deg,#1a2545,#0f1a30);border:2px solid #f0b429;border-radius:12px;padding:10px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.achievement .ic{font-size:26px}
.achievement .info{flex:1}
.achievement .name{font-size:13px;font-weight:900;color:#f0b429}
.achievement .desc{font-size:11px;color:#8b949e;margin-top:2px}

/* RECORDS */
.record{background:#161b22;border:2px solid #30363d;border-radius:10px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.record .ex-name{font-size:13px;font-weight:800}
.record .ex-weight{font-size:16px;font-weight:900;color:#f0b429;font-variant-numeric:tabular-nums}
.record .ex-date{font-size:10px;color:#6a737d}
</style>
</head>
<body>

<div class="app">

  <!-- ТАЙМЕР ОТДЫХА -->
  <div class="rest-timer" id="restTimer">
    <span>⏱ ОТДЫХ:</span>
    <span class="time" id="restTime">1:30</span>
    <button onclick="stopRest()" style="background:#000;border:none;color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer">✕</button>
  </div>

  <!-- ШАПКА -->
  <div class="header">
    <div class="logo">💪 ТРЕНИРОВКА</div>
    <div class="stats-row">
      <div class="stat-mini">
        <div class="num" id="statToday">0</div>
        <div class="lbl">Сегодня</div>
      </div>
      <div class="stat-mini">
        <div class="num" id="statTotal">0</div>
        <div class="lbl">Всего</div>
      </div>
      <div class="stat-mini">
        <div class="num" id="statVolume">0</div>
        <div class="lbl">Объём кг</div>
      </div>
    </div>
  </div>

  <!-- ТАБЫ -->
  <div style="padding:12px 12px 0">
    <div class="tabs">
      <button class="tab active" onclick="setTab('workout')" id="tab-workout">💪 Трен</button>
      <button class="tab" onclick="setTab('records')" id="tab-records">🏆 Рекорды</button>
      <button class="tab" onclick="setTab('templates')" id="tab-templates">📋 Шаблоны</button>
      <button class="tab" onclick="setTab('progress')" id="tab-progress">📊 Прогресс</button>
    </div>
  </div>

  <!-- КОНТЕНТ -->
  <div class="content" id="content"></div>

  <!-- КНОПКА + -->
  <button class="add-btn" onclick="openAddModal()" id="addBtn">+</button>

</div>

<!-- МОДАЛКА ДОБАВЛЕНИЯ -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modalContent"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// ТРЕНИРОВКА — дневник упражнений
// ============================================================

const STORAGE_KEY = "gym_diary_v1";

const EXERCISES_LIB = [
  { name: "Жим лёжа", emoji: "🏋️", muscle: "Грудь" },
  { name: "Жим гантелей", emoji: "💪", muscle: "Грудь" },
  { name: "Отжимания на брусьях", emoji: "🔻", muscle: "Грудь" },
  { name: "Приседания со штангой", emoji: "🦵", muscle: "Ноги" },
  { name: "Жим ногами", emoji: "🦿", muscle: "Ноги" },
  { name: "Румынская тяга", emoji: "🏋️", muscle: "Ноги" },
  { name: "Становая тяга", emoji: "💀", muscle: "Спина" },
  { name: "Подтягивания", emoji: "🆙", muscle: "Спина" },
  { name: "Тяга штанги в наклоне", emoji: "🎣", muscle: "Спина" },
  { name: "Жим стоя", emoji: "🎯", muscle: "Плечи" },
  { name: "Разводка гантелей", emoji: "🦅", muscle: "Плечи" },
  { name: "Подъём штанги на бицепс", emoji: "💪", muscle: "Руки" },
  { name: "Французский жим", emoji: "🇫🇷", muscle: "Руки" },
  { name: "Планка", emoji: "⏱️", muscle: "Пресс" },
  { name: "Скручивания", emoji: "🌀", muscle: "Пресс" },
  { name: "Подъём ног", emoji: "🦵", muscle: "Пресс" },
  { name: "Бег на дорожке", emoji: "🏃", muscle: "Кардио" },
  { name: "Велотренажёр", emoji: "🚴", muscle: "Кардио" },
];

const TEMPLATES = [
  { name: "Грудь + Трицепс", emoji: "🏋️", exercises: ["Жим лёжа", "Жим гантелей", "Отжимания на брусьях", "Французский жим"] },
  { name: "Спина + Бицепс", emoji: "💀", exercises: ["Становая тяга", "Подтягивания", "Тяга штанги в наклоне", "Подъём штанги на бицепс"] },
  { name: "Ноги + Плечи", emoji: "🦵", exercises: ["Приседания со штангой", "Жим ногами", "Румынская тяга", "Жим стоя"] },
  { name: "Пресс + Кардио", emoji: "🔥", exercises: ["Планка", "Скручивания", "Подъём ног", "Бег на дорожке"] },
  { name: "Full Body", emoji: "💪", exercises: ["Приседания со штангой", "Жим лёжа", "Становая тяга", "Подтягивания"] },
];

const ACHIEVEMENTS = [
  { id: "first", name: "Первый шаг", desc: "Сделай первую тренировку", emoji: "🎯" },
  { id: "ten", name: "Не сдаёшься", desc: "10 тренировок", emoji: "💪" },
  { id: "fifty", name: "Машина", desc: "50 тренировок", emoji: "🤖" },
  { id: "hundred", name: "Титан", desc: "100 тренировок", emoji: "👑" },
  { id: "bench100", name: "Сотка", desc: "Жим лёжа 100 кг", emoji: "🏋️" },
  { id: "squat150", name: "Мощь", desc: "Присед 150 кг", emoji: "🦵" },
  { id: "dead200", name: "Стальной хват", desc: "Становая 200 кг", emoji: "💀" },
  { id: "volume10k", name: "10 тонн", desc: "Поднял 10 000 кг всего", emoji: "📦" },
];

let state = {
  workouts: JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"workouts":[]}'),
  tab: "workout",
};

// ДОБАВИТЬ В state структуру
state.workouts = state.workouts.workouts || [];

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ workouts: state.workouts }));
}

function today() {
  return new Date().toISOString().split('T')[0];
}

function formatDate(d) {
  const date = new Date(d);
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return `${date.getDate()} ${months[date.getMonth()]}`;
}

// ============================================================
// РЕНДЕР
// ============================================================
function setTab(t) {
  state.tab = t;
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', ['workout','records','templates','progress'][i] === t);
  });
  // Показать/скрыть кнопку +
  document.getElementById('addBtn').style.display = (t === 'workout' || t === 'templates') ? 'flex' : 'none';
  render();
}

function render() {
  if (state.tab === "workout") renderWorkout();
  else if (state.tab === "records") renderRecords();
  else if (state.tab === "templates") renderTemplates();
  else if (state.tab === "progress") renderProgress();
  updateStats();
}

function updateStats() {
  const todayStr = today();
  const todayWorkouts = state.workouts.filter(w => w.date === todayStr);
  const totalWorkouts = state.workouts.length;
  let volume = 0;
  state.workouts.forEach(w => {
    w.exercises.forEach(e => {
      e.sets.forEach(s => {
        const reps = parseFloat(s.reps) || 0;
        const weight = parseFloat(s.weight) || 0;
        volume += reps * weight;
      });
    });
  });
  document.getElementById('statToday').textContent = todayWorkouts.length;
  document.getElementById('statTotal').textContent = totalWorkouts;
  document.getElementById('statVolume').textContent = Math.round(volume).toLocaleString();
}

// ---------- ТРЕНИРОВКА (текущая) ----------
function renderWorkout() {
  const el = document.getElementById('content');
  const todayStr = today();
  const todayWorkouts = state.workouts.filter(w => w.date === todayStr);

  if (todayWorkouts.length === 0) {
    el.innerHTML = `
      <div class="empty">
        <div class="big">💪</div>
        <h3>Нет тренировок сегодня</h3>
        <p>Нажми <b style="color:#3fb950">+</b> внизу, чтобы добавить упражнение</p>
      </div>
      <div class="card template" onclick="showTemplatesHint()" style="margin-top:20px">
        <div class="card-title"><span class="emoji">📋</span> Использовать шаблон</div>
        <div style="font-size:12px;color:#8b949e;margin-top:6px">Готовые программы: грудь+трицепс, спина+бицепс, ноги+плечи и другие</div>
      </div>
    `;
    return;
  }

  let html = '';
  todayWorkouts.forEach(workout => {
    html += `<div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:800">Тренировка #${workout.id}</div>`;
    workout.exercises.forEach((ex, exIdx) => {
      html += renderExerciseCard(workout.id, ex, exIdx);
    });
  });

  // Кнопки
  html += `<button class="btn" onclick="openAddModal()">+ ДОБАВИТЬ УПРАЖНЕНИЕ</button>`;
  html += `<button class="btn red" onclick="finishWorkout()">✓ ЗАВЕРШИТЬ ТРЕНИРОВКУ</button>`;

  el.innerHTML = html;
}

function renderExerciseCard(workoutId, ex, exIdx) {
  const exLib = EXERCISES_LIB.find(e => e.name === ex.name);
  const emoji = exLib ? exLib.emoji : "💪";
  const totalSets = ex.sets.length;
  const avgWeight = ex.sets.reduce((s, x) => s + (parseFloat(x.weight) || 0), 0) / (totalSets || 1);
  const maxReps = Math.max(...ex.sets.map(x => parseInt(x.reps) || 0), 0);
  let setsHtml = '';
  ex.sets.forEach((s, sIdx) => {
    setsHtml += `
      <div class="set-row">
        <div class="set-num">${sIdx + 1}</div>
        <input class="set-input" type="number" placeholder="кг" value="${s.weight || ''}" onchange="updateSet(${workoutId}, ${exIdx}, ${sIdx}, 'weight', this.value)">
        <div class="set-label">кг × </div>
        <input class="set-input" type="number" placeholder="повт" value="${s.reps || ''}" onchange="updateSet(${workoutId}, ${exIdx}, ${sIdx}, 'reps', this.value)">
        <button class="set-remove" onclick="removeSet(${workoutId}, ${exIdx}, ${sIdx})">✕</button>
      </div>
    `;
  });
  return `
    <div class="card exercise">
      <div class="card-header">
        <div class="card-title"><span class="emoji">${emoji}</span> ${ex.name}</div>
        <button class="card-del" onclick="removeExercise(${workoutId}, ${exIdx})">✕</button>
      </div>
      <div class="ex-sets" id="sets-${workoutId}-${exIdx}">
        ${setsHtml}
      </div>
      <button class="add-set" onclick="addSet(${workoutId}, ${exIdx})">+ Добавить подход</button>
      <button class="add-set" style="border-color:#f0b429;color:#f0b429;margin-top:6px" onclick="startRest()">⏱ Отдых 1:30</button>
    </div>
  `;
}

// ---------- РЕКОРДЫ ----------
function renderRecords() {
  const el = document.getElementById('content');
  const records = {};

  state.workouts.forEach(w => {
    w.exercises.forEach(e => {
      e.sets.forEach(s => {
        const weight = parseFloat(s.weight) || 0;
        const reps = parseInt(s.reps) || 0;
        if (weight > 0 && reps > 0) {
          const exName = e.name;
          if (!records[exName] || weight > records[exName].weight) {
            records[exName] = { weight, reps, date: w.date };
          }
        }
      });
    });
  });

  const keys = Object.keys(records);

  if (keys.length === 0) {
    el.innerHTML = `
      <div class="empty">
        <div class="big">🏆</div>
        <h3>Рекордов пока нет</h3>
        <p>Запиши тренировки — и тут появятся твои лучшие результаты</p>
      </div>
    `;
    return;
  }

  keys.sort((a, b) => records[b].weight - records[a].weight);

  let html = '<div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:800">🏆 Личные рекорды</div>';
  keys.forEach(name => {
    const r = records[name];
    const exLib = EXERCISES_LIB.find(e => e.name === name);
    const emoji = exLib ? exLib.emoji : "💪";
    html += `
      <div class="record">
        <div>
          <div class="ex-name">${emoji} ${name}</div>
          <div class="ex-date">${formatDate(r.date)} · ${r.reps} повт</div>
        </div>
        <div class="ex-weight">${r.weight} кг</div>
      </div>
    `;
  });

  // Достижения
  html += '<div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin:20px 0 8px;font-weight:800">🏅 Достижения</div>';
  const unlocked = checkAchievements(records);
  ACHIEVEMENTS.forEach(a => {
    const isUnlocked = unlocked.includes(a.id);
    html += `
      <div class="achievement" style="${isUnlocked ? '' : 'opacity:.4;filter:grayscale(1)'}">
        <div class="ic">${isUnlocked ? a.emoji : '🔒'}</div>
        <div class="info">
          <div class="name">${a.name}</div>
          <div class="desc">${a.desc}</div>
        </div>
      </div>
    `;
  });

  el.innerHTML = html;
}

function checkAchievements(records) {
  const unlocked = [];
  if (state.workouts.length >= 1) unlocked.push("first");
  if (state.workouts.length >= 10) unlocked.push("ten");
  if (state.workouts.length >= 50) unlocked.push("fifty");
  if (state.workouts.length >= 100) unlocked.push("hundred");
  if (records["Жим лёжа"] && records["Жим лёжа"].weight >= 100) unlocked.push("bench100");
  if (records["Приседания со штангой"] && records["Приседания со штангой"].weight >= 150) unlocked.push("squat150");
  if (records["Становая тяга"] && records["Становая тяга"].weight >= 200) unlocked.push("dead200");
  let volume = 0;
  state.workouts.forEach(w => w.exercises.forEach(e => e.sets.forEach(s => {
    volume += (parseFloat(s.weight) || 0) * (parseInt(s.reps) || 0);
  })));
  if (volume >= 10000) unlocked.push("volume10k");
  return unlocked;
}

// ---------- ШАБЛОНЫ ----------
function renderTemplates() {
  const el = document.getElementById('content');
  let html = '<div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:800">📋 Готовые программы</div>';
  TEMPLATES.forEach((t, i) => {
    html += `
      <div class="card template" onclick="useTemplate(${i})">
        <div class="card-title"><span class="emoji">${t.emoji}</span> ${t.name}</div>
        <div style="font-size:12px;color:#8b949e;margin-top:8px;line-height:1.6">
          ${t.exercises.map(e => '• ' + e).join('<br>')}
        </div>
      </div>
    `;
  });
  el.innerHTML = html;
}

function useTemplate(i) {
  const t = TEMPLATES[i];
  const todayStr = today();
  let workout = state.workouts.find(w => w.date === todayStr);
  if (!workout) {
    workout = {
      id: state.workouts.length + 1,
      date: todayStr,
      exercises: [],
    };
    state.workouts.push(workout);
  }
  t.exercises.forEach(name => {
    workout.exercises.push({
      name,
      sets: [{ weight: "", reps: "" }],
    });
  });
  save();
  showToast(`✅ Шаблон "${t.name}" добавлен`);
  setTab('workout');
}

function showTemplatesHint() {
  setTab('templates');
}

// ---------- ПРОГРЕСС ----------
function renderProgress() {
  const el = document.getElementById('content');

  if (state.workouts.length === 0) {
    el.innerHTML = `
      <div class="empty">
        <div class="big">📊</div>
        <h3>Нет данных</h3>
        <p>Запиши тренировки — здесь появится прогресс</p>
      </div>
    `;
    return;
  }

  // Топ-5 упражнений по объёму
  const exerciseVolume = {};
  state.workouts.forEach(w => {
    w.exercises.forEach(e => {
      if (!exerciseVolume[e.name]) exerciseVolume[e.name] = 0;
      e.sets.forEach(s => {
        exerciseVolume[e.name] += (parseFloat(s.weight) || 0) * (parseInt(s.reps) || 0);
      });
    });
  });

  const top = Object.entries(exerciseVolume).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maxVol = top[0] ? top[0][1] : 1;

  let html = '<div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:800">📊 Топ упражнений по объёму</div>';
  top.forEach(([name, vol]) => {
    const pct = (vol / maxVol) * 100;
    const exLib = EXERCISES_LIB.find(e => e.name === name);
    const emoji = exLib ? exLib.emoji : "💪";
    html += `
      <div class="progress-card">
        <div class="progress-title">${emoji} ${name}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-info">
          <span>Объём: <b>${Math.round(vol).toLocaleString()} кг</b></span>
          <span>${Math.round(pct)}%</span>
        </div>
      </div>
    `;
  });

  // Общая статистика
  let totalVolume = 0;
  let totalSets = 0;
  let totalReps = 0;
  state.workouts.forEach(w => {
    w.exercises.forEach(e => {
      e.sets.forEach(s => {
        const r = parseInt(s.reps) || 0;
        const wt = parseFloat(s.weight) || 0;
        totalReps += r;
        totalVolume += r * wt;
        if (r > 0 || wt > 0) totalSets++;
      });
    });
  });

  html += '<div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin:20px 0 8px;font-weight:800">📈 Общая статистика</div>';
  html += `
    <div class="progress-card">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px">
        <div><div style="color:#8b949e;font-size:11px">Тренировок</div><div style="font-size:20px;font-weight:900;color:#3fb950">${state.workouts.length}</div></div>
        <div><div style="color:#8b949e;font-size:11px">Подходов</div><div style="font-size:20px;font-weight:900;color:#3fb950">${totalSets}</div></div>
        <div><div style="color:#8b949e;font-size:11px">Повторений</div><div style="font-size:20px;font-weight:900;color:#3fb950">${totalReps}</div></div>
        <div><div style="color:#8b949e;font-size:11px">Объём</div><div style="font-size:20px;font-weight:900;color:#f0b429">${Math.round(totalVolume).toLocaleString()} кг</div></div>
      </div>
    </div>
  `;

  el.innerHTML = html;
}

// ============================================================
// ДЕЙСТВИЯ
// ============================================================
function addExercise(name) {
  const todayStr = today();
  let workout = state.workouts.find(w => w.date === todayStr);
  if (!workout) {
    workout = {
      id: state.workouts.length + 1,
      date: todayStr,
      exercises: [],
    };
    state.workouts.push(workout);
  }
  workout.exercises.push({
    name,
    sets: [{ weight: "", reps: "" }],
  });
  save();
  showToast(`✅ ${name} добавлено`);
  render();
}

function updateSet(workoutId, exIdx, setIdx, field, value) {
  const w = state.workouts.find(x => x.id === workoutId);
  if (!w) return;
  const ex = w.exercises[exIdx];
  if (!ex) return;
  ex.sets[setIdx][field] = value;
  save();
  updateStats();
}

function addSet(workoutId, exIdx) {
  const w = state.workouts.find(x => x.id === workoutId);
  if (!w) return;
  const ex = w.exercises[exIdx];
  if (!ex) return;
  const lastSet = ex.sets[ex.sets.length - 1];
  ex.sets.push({ weight: lastSet ? lastSet.weight : "", reps: lastSet ? lastSet.reps : "" });
  save();
  render();
}

function removeSet(workoutId, exIdx, setIdx) {
  const w = state.workouts.find(x => x.id === workoutId);
  if (!w) return;
  const ex = w.exercises[exIdx];
  if (!ex) return;
  ex.sets.splice(setIdx, 1);
  if (ex.sets.length === 0) ex.sets.push({ weight: "", reps: "" });
  save();
  render();
}

function removeExercise(workoutId, exIdx) {
  if (!confirm('Удалить упражнение?')) return;
  const w = state.workouts.find(x => x.id === workoutId);
  if (!w) return;
  w.exercises.splice(exIdx, 1);
  if (w.exercises.length === 0) {
    state.workouts = state.workouts.filter(x => x.id !== workoutId);
  }
  save();
  render();
}

function finishWorkout() {
  if (!confirm('Завершить тренировку? Она сохранится в истории.')) return;
  save();
  showToast('💪 Тренировка завершена!');
  setTimeout(render, 400);
}

// МОДАЛКА ДОБАВЛЕНИЯ УПРАЖНЕНИЯ
// ============================================================
function openAddModal() {
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <div class="modal-title">➕ Добавить упражнение</div>

    <div class="form-group">
      <label class="form-label">Название упражнения</label>
      <input type="text" class="form-input" id="exName" placeholder="Введи название...">
    </div>

    <div class="form-group">
      <label class="form-label">Быстрый выбор</label>
      <div class="quick-picks">
        ${EXERCISES_LIB.slice(0, 9).map(e =>
          `<div class="quick-pick" onclick="document.getElementById('exName').value='${e.name}'">${e.emoji} ${e.name}</div>`
        ).join('')}
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Или выбери из библиотеки</label>
      <select class="form-input" id="exSelect" style="color:#fff">
        <option value="">-- Выбери упражнение --</option>
        ${EXERCISES_LIB.map(e => `<option value="${e.name}">${e.emoji} ${e.name} (${e.muscle})</option>`).join('')}
      </select>
    </div>

    <button class="btn" onclick="submitExercise()">ДОБАВИТЬ</button>

  `;

}

function submitExercise() {
  const name = document.getElementById('exName').value.trim();
  if (!name) { showToast('❌ Введи название'); return; }
  addExercise(name);
  closeModal();
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

// ============================================================
// ТАЙМЕР ОТДЫХА
// ============================================================
let restInterval = null;
let restSeconds = 90;

function startRest(sec = 90) {
  restSeconds = sec;
  const el = document.getElementById('restTimer');
  el.classList.add('show');
  updateRestTime();
  if (restInterval) clearInterval(restInterval);
  restInterval = setInterval(() => {
    restSeconds--;
    updateRestTime();
    if (restSeconds <= 0) {
      stopRest();
      showToast('⏰ Отдых закончен! В бой!');
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }
  }, 1000);
}

function updateRestTime() {
  const m = Math.floor(restSeconds / 60);
  const s = restSeconds % 60;
  document.getElementById('restTime').textContent = `${m}:${s.toString().padStart(2, '0')}`;
}

function stopRest() {
  if (restInterval) clearInterval(restInterval);
  restInterval = null;
  document.getElementById('restTimer').classList.remove('show');
}

// ============================================================
// TOAST
// ============================================================
let toastTimer = null;
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ============================================================
// СТАРТ
// ============================================================
function init() {
  document.getElementById('addBtn').style.display = 'flex';
  render();
}
init();
</script>
