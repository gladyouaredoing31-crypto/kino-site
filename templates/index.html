<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>@ ЮЗЕРНЕЙМЫ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#0a0e14;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;color:#e6edf3}

.app{position:relative;width:100vw;height:100vh;max-width:480px;margin:0 auto;background:radial-gradient(circle at 50% 0%,#1a2545,#0a0e14 60%);display:flex;flex-direction:column;overflow:hidden}

/* ШАПКА */
.header{padding:16px 16px 8px;text-align:center;flex-shrink:0}
.logo{font-size:24px;font-weight:900;background:linear-gradient(135deg,#58a6ff,#a855f7,#58a6ff);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shine 3s infinite;letter-spacing:2px}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.subtitle{font-size:10px;color:#8b949e;letter-spacing:4px;text-transform:uppercase;margin-top:4px}

/* КОНТЕНТ */
.content{flex:1;overflow-y:auto;padding:12px 16px;scrollbar-width:thin}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}

/* СТИЛИ */
.section-title{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;font-weight:800;padding-left:2px}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.style-btn{background:linear-gradient(135deg,#161b22,#1c2333);border:2px solid #30363d;border-radius:12px;padding:12px 10px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.style-btn:active{transform:scale(.96)}
.style-btn.active{border-color:#58a6ff;background:linear-gradient(135deg,#1c2333,#1a2545);box-shadow:0 0 0 2px rgba(88,166,255,.3),0 0 20px rgba(88,166,255,.3)}
.style-emoji{font-size:24px}
.style-name{font-size:12px;font-weight:800;letter-spacing:.5px}
.style-desc{font-size:9px;color:#8b949e;line-height:1.2}

/* ДЛИНА */
.length-row{display:flex;gap:6px;margin-bottom:14px}
.length-btn{flex:1;background:#161b22;border:2px solid #30363d;border-radius:10px;padding:10px 4px;color:#8b949e;font-size:12px;font-weight:800;cursor:pointer;transition:.15s}
.length-btn:active{transform:scale(.96)}
.length-btn.active{background:linear-gradient(180deg,#58a6ff,#1f6feb);color:#fff;border-color:#79c0ff}

/* КНОПКА ГЕНЕРАЦИИ */
.gen-btn{width:100%;background:linear-gradient(180deg,#58a6ff,#1f6feb);border:2px solid #79c0ff;color:#fff;padding:16px;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;transition:.1s;box-shadow:0 6px 20px rgba(88,166,255,.5);display:flex;align-items:center;justify-content:center;gap:8px}
.gen-btn:active{transform:scale(.97);box-shadow:0 3px 10px rgba(88,166,255,.4)}

/* РЕЗУЛЬТАТЫ */
.results-info{font-size:11px;color:#8b949e;margin-bottom:10px;text-align:center;padding:6px}
.results-info b{color:#58a6ff}

.username-card{background:linear-gradient(135deg,#161b22,#1c2333);border:2px solid #30363d;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:.15s;cursor:pointer}
.username-card:active{transform:scale(.98)}
.username-card:hover{border-color:#58a6ff}
.username-card.fav{border-color:#ff6b6b;background:linear-gradient(135deg,#1f1520,#2a1a1f)}

.username-text{font-family:'Courier New',monospace;font-size:16px;font-weight:800;color:#79c0ff;flex:1;word-break:break-all;line-height:1.2}
.username-text .at{color:#f0b429}
.username-length{font-size:9px;color:#6a737d;font-weight:700;background:#0a0e14;padding:2px 6px;border-radius:6px;flex-shrink:0}

.username-actions{display:flex;gap:4px;flex-shrink:0}
.us-btn{background:#0a0e14;border:1px solid #30363d;color:#c9d1d9;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s}
.us-btn:active{transform:scale(.9);background:#1c2333}
.us-btn.copied{background:#3fb950;border-color:#7ee787;color:#fff}
.us-btn.fav-active{background:#ff6b6b;border-color:#ff6b6b;color:#fff}

/* ПУСТО */
.empty{text-align:center;padding:50px 20px;color:#6a737d}
.empty .big{font-size:56px;margin-bottom:14px;opacity:.4}
.empty h3{font-size:15px;margin-bottom:6px;color:#c9d1d9}
.empty p{font-size:12px;line-height:1.5}

/* ТАБЫ */
.tabs{display:flex;gap:4px;background:#161b22;padding:6px;margin:0 16px;border-radius:12px;flex-shrink:0}
.tab{flex:1;background:transparent;border:none;color:#8b949e;padding:9px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;transition:.2s;text-transform:uppercase;letter-spacing:.5px}
.tab.active{background:linear-gradient(135deg,#58a6ff,#1f6feb);color:#fff}
.tab:active{transform:scale(.97)}

.hidden{display:none!important}

/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#161b22;border:2px solid #3fb950;color:#3fb950;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;transition:.3s;z-index:200;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="app">

  <!-- ШАПКА -->
  <div class="header">
    <div class="logo">@ ЮЗЕРНЕЙМЫ</div>
    <div class="subtitle">Красивые для Telegram</div>
  </div>

  <!-- ТАБЫ -->
  <div class="tabs" style="margin-bottom:12px">
    <button class="tab active" id="tabGen" onclick="setTab('gen')">🎲 Генератор</button>
    <button class="tab" id="tabFav" onclick="setTab('fav')">❤️ Избранное</button>
  </div>

  <!-- ЭКРАН ГЕНЕРАЦИИ -->
  <div class="content" id="content-gen">

    <div class="section-title">🎨 Выбери стиль</div>
    <div class="styles" id="stylesGrid"></div>

    <div class="section-title">📏 Длина</div>
    <div class="length-row" id="lengthRow"></div>

    <button class="gen-btn" onclick="generate()">
      <span style="font-size:20px">🎲</span> СГЕНЕРИРОВАТЬ
    </button>

    <div id="results" style="margin-top:10px"></div>
  </div>

  <!-- ЭКРАН ИЗБРАННОГО -->
  <div class="content hidden" id="content-fav">
    <div class="section-title">❤️ Избранные юзернеймы</div>
    <div id="favResults"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// ГЕНЕРАТОР ЮЗЕРНЕЙМОВ
// ============================================================

const STYLES = {
  premium: {
    name: "Премиум",
    emoji: "💎",
    desc: "vip, gold, luxury",
    words: ["vip","gold","luxury","premium","royal","elite","king","queen","boss","lord","duke","boss","rich","money","diamond","crown","empire","luxe","noble","regal"],
    prefixes: ["the_","mr_","_","x_","official_"],
    suffixes: ["_off","_vip","_pro","_king","_royal","_x","_official","_boss","_gold"],
    useDigits: true,
    digits: ["777","888","100","99","x","1"]
  },
  aesthetic: {
    name: "Эстетика",
    emoji: "🌸",
    desc: "soft, moon, dream",
    words: ["moon","star","dream","soft","angel","cloud","rose","pink","soul","light","aurora","sunset","dawn","veil","luna","astra","aura","bloom","mist","sky"],
    prefixes: ["_","x_","its_","the_","a_"],
    suffixes: ["_","xx","_x","_core","_vibes","_aesthetic","_love","_soft"],
    useDigits: false,
    digits: []
  },
  gamer: {
    name: "Геймер",
    emoji: "🎮",
    desc: "pro, killer, xx",
    words: ["pro","killer","sniper","ghost","ninja","shadow","hunter","beast","doom","venom","dragon","wolf","hawk","viper","reaper","storm","blade","phantom","cyber","warrior"],
    prefixes: ["xx_","_","pro_","mr_","the_"],
    suffixes: ["_xx","_pro","_gg","_yt","_kill","_666","_xd","_op","_1tap","_aces"],
    useDigits: true,
    digits: ["666","777","228","999","13","007"]
  },
  crypto: {
    name: "Крипто",
    emoji: "💰",
    desc: "trader, invest, btc",
    words: ["crypto","trader","invest","btc","eth","block","coin","chain","bit","satoshi","nft","defi","wallet","token","hodl","bull","pump","moon","rich","earn"],
    prefixes: ["_","mr_","pro_","the_"],
    suffixes: ["_btc","_eth","_pro","_trader","_hodl","_crypto","_invest","_money"],
    useDigits: true,
    digits: ["777","100x","21","1000","88","999"]
  },
  short: {
    name: "Короткие",
    emoji: "⚡",
    desc: "3-4 буквы",
    words: ["zen","pro","max","neo","ace","top","one","red","fox","sky","sun","ice","art","key","god","raw","win","x","vip","lux"],
    prefixes: [""],
    suffixes: [""],
    useDigits: false,
    digits: []
  },
  cute: {
    name: "Милые",
    emoji: "🐱",
    desc: "kitty, bunny, honey",
    words: ["kitty","bunny","honey","cutie","baby","kiss","love","hug","sunny","peach","cherry","muffin","cupcake","smile","happy","angel","fairy","flower","sweet","candy"],
    prefixes: ["_","its_","little_","baby_"],
    suffixes: ["_","_chan","_love","_cat","_honey","_kiss","_bunny"],
    useDigits: false,
    digits: []
  },
  boss: {
    name: "Дерзкие",
    emoji: "🔥",
    desc: "boss, legend, gang",
    words: ["boss","legend","gang","thug","king","capo","mafia","shot","dope","flex","beast","wild","savage","ruler","chief","sigma","alpha","topg","goat"],
    prefixes: ["_","mr_","the_"],
    suffixes: ["_boss","_legend","_gang","_666","_xl","_official","_topg","_goat"],
    useDigits: true,
    digits: ["666","888","1","7","9"]
  },
  mystery: {
    name: "Загадка",
    emoji: "🌙",
    desc: "hidden, secret, ghost",
    words: ["hidden","secret","ghost","shadow","unknown","veil","mystic","silent","void","dark","night","raven","wolf","phantom","lost","wander","echo","whisper","rune","arcane"],
    prefixes: ["_","mr_","the_","x_"],
    suffixes: ["_","_x","_ghost","_dark","_void","_silent","_hidden"],
    useDigits: false,
    digits: []
  },
};

const LENGTHS = [
  { id: "any", name: "Любая", min: 0, max: 100 },
  { id: "s", name: "3-5", min: 3, max: 5 },
  { id: "m", name: "6-9", min: 6, max: 9 },
  { id: "l", name: "10-15", min: 10, max: 15 },
];

const FAV_KEY = "usernames_fav_v1";

let state = {
  style: "premium",
  length: "any",
  results: [],
  favorites: JSON.parse(localStorage.getItem(FAV_KEY) || "[]"),
  tab: "gen",
};

// ============================================================
// ГЕНЕРАЦИЯ
// ============================================================
function randomOf(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generate() {
  const style = STYLES[state.style];
  const lenFilter = LENGTHS.find(l => l.id === state.length);
  const results = [];
  const seen = new Set();
  let attempts = 0;
  const targetCount = 100;
  const maxAttempts = 3000;

  while (results.length < targetCount && attempts < maxAttempts) {
    attempts++;

    const word = randomOf(style.words);
    const usePrefix = Math.random() < 0.5;
    const useSuffix = Math.random() < 0.6;
    const useDigit = style.useDigits && style.digits.length > 0 && Math.random() < 0.35;

    let name = "";
    if (usePrefix && style.prefixes.length) name += randomOf(style.prefixes);
    name += word;
    if (useSuffix && style.suffixes.length) name += randomOf(style.suffixes);
    if (useDigit) name += randomOf(style.digits);

    // Убрать лишние символы
    name = name.replace(/^[_\.]+|[_\.]+$/g, '').replace(/__+/g, '_').replace(/\.\.+/g, '.');
    
    if (!name) continue;
    if (name.length < 3) continue;

    // Проверка длины
    if (state.length !== "any") {
      if (name.length < lenFilter.min || name.length > lenFilter.max) continue;
    }

    // Уникальность
    if (seen.has(name)) continue;
    seen.add(name);

    results.push(name);
  }

  state.results = results;
  renderResults();

  if (results.length === 0) {
    showToast('😔 Ничего не подобралось — попробуй другой стиль/длину');
  } else {
    showToast('✨ Сгенерировано: ' + results.length);
  }
}

// ============================================================
// РЕНДЕР
// ============================================================
function renderStyles() {
  const el = document.getElementById('stylesGrid');
  el.innerHTML = Object.entries(STYLES).map(([key, s]) =>
    `<div class="style-btn ${state.style === key ? 'active' : ''}" onclick="setStyle('${key}')">
      <div class="style-emoji">${s.emoji}</div>
      <div class="style-name">${s.name}</div>
      <div class="style-desc">${s.desc}</div>
    </div>`
  ).join('');
}

function renderLengths() {
  const el = document.getElementById('lengthRow');
  el.innerHTML = LENGTHS.map(l =>
    `<button class="length-btn ${state.length === l.id ? 'active' : ''}" onclick="setLength('${l.id}')">${l.name}</button>`
  ).join('');
}

function renderResults() {
  const el = document.getElementById('results');
  if (!state.results.length) {
    el.innerHTML = `
      <div class="empty">
        <div class="big">🎲</div>
        <h3>Нажми «Сгенерировать»</h3>
        <p>Появятся красивые варианты юзернеймов</p>
      </div>`;
    return;
  }

  const html = `
    <div class="results-info">Найдено: <b>${state.results.length}</b> вариантов · тапни ❤️ чтобы сохранить</div>
    ${state.results.map(name => {
      const isFav = state.favorites.includes(name);
      return `
        <div class="username-card ${isFav ? 'fav' : ''}">
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
            <div class="username-text"><span class="at">@</span>${escapeHtml(name)}</div>
            <div class="username-length">${name.length} симв.</div>
          </div>
          <div class="username-actions">
            <button class="us-btn" onclick="event.stopPropagation();copyName('${escapeAttr(name)}', this)" title="Копировать">📋</button>
            <button class="us-btn ${isFav ? 'fav-active' : ''}" onclick="event.stopPropagation();toggleFav('${escapeAttr(name)}')" title="Избранное">${isFav ? '❤️' : '🤍'}</button>
            <a class="us-btn" href="https://t.me/username_bot" target="_blank" onclick="event.stopPropagation()" title="Проверить в Telegram">✅</a>
          </div>
        </div>
      `;
    }).join('')}
  `;
  el.innerHTML = html;
}

function renderFav() {
  const el = document.getElementById('favResults');
  if (!state.favorites.length) {
    el.innerHTML = `
      <div class="empty">
        <div class="big">❤️</div>
        <h3>Избранных пока нет</h3>
        <p>Тапни на ❤️ рядом с юзернеймом, чтобы сохранить</p>
      </div>`;
    return;
  }

  el.innerHTML = state.favorites.map(name => `
    <div class="username-card fav">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
        <div class="username-text"><span class="at">@</span>${escapeHtml(name)}</div>
        <div class="username-length">${name.length} симв.</div>
      </div>
      <div class="username-actions">
        <button class="us-btn" onclick="copyName('${escapeAttr(name)}', this)">📋</button>
        <button class="us-btn fav-active" onclick="toggleFav('${escapeAttr(name)}')">❤️</button>
        <a class="us-btn" href="https://t.me/username_bot" target="_blank">✅</a>
      </div>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

// ============================================================
// ДЕЙСТВИЯ
// ============================================================
function setStyle(s) {
  state.style = s;
  renderStyles();
  generate();
}

function setLength(l) {
  state.length = l;
  renderLengths();
}

function setTab(t) {
  state.tab = t;
  document.getElementById('tabGen').classList.toggle('active', t === 'gen');
  document.getElementById('tabFav').classList.toggle('active', t === 'fav');
  document.getElementById('content-gen').classList.toggle('hidden', t !== 'gen');
  document.getElementById('content-fav').classList.toggle('hidden', t !== 'fav');
  if (t === 'fav') renderFav();
}

async function copyName(name, btn) {
  try {
    await navigator.clipboard.writeText('@' + name);
    showToast('📋 Скопировано: @' + name);
    if (btn) {
      btn.classList.add('copied');
      btn.textContent = '✓';
      setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋'; }, 1200);
    }
    if (navigator.vibrate) navigator.vibrate(20);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = '@' + name;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('📋 Скопировано'); }
    catch (err) { showToast('❌ Не удалось'); }
    document.body.removeChild(ta);
  }
}

function toggleFav(name) {
  const idx = state.favorites.indexOf(name);
  if (idx > -1) {
    state.favorites.splice(idx, 1);
    showToast('💔 Убрано из избранного');
  } else {
    state.favorites.push(name);
    showToast('❤️ Добавлено в избранное');
  }
  localStorage.setItem(FAV_KEY, JSON.stringify(state.favorites));
  renderResults();
  if (state.tab === 'fav') renderFav();
}

// ============================================================
// TOAST
// ============================================================
let toastTimer = null;
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
function init() {
  renderStyles();
  renderLengths();
  generate();
}
init();
</script>
</body>
</html>
